name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the deploy job may write to Pages and request an OIDC token.
permissions:
  contents: read

# One deployment at a time; a running deployment is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# Every action is pinned to a full commit SHA; the comment names its release tag.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # configure-pages reads the repository's Pages settings.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The same gate as CI's check job (without the e2e specs), so the site is
      # only deployed from a commit that passes it.
      - run: npm run typecheck
      - run: npm run check
      - run: npm test

      # Vite resolves the engine from source (see apps/web/vite.config.ts), so the
      # web build needs no prior tsc -b. A project site lives under /<repository>/.
      - name: Build the web app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build -w @waycine/web -- --base "$BASE_PATH"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
