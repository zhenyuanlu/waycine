name: CI

# Pushes to main, and pull requests (which cover pushes to their branches), so a
# pull request branch is not tested twice per push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per workflow and ref; a newer push to a pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# Every action is pinned to a full commit SHA; the comment names its release tag.
jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # tsc -b (engine and CLI into dist/), then the web app's Vite build.
      - run: npm run build

      # Biome, then the repository hygiene check.
      - run: npm run check

      - run: npm run typecheck

      # Golden frames compare strictly only on the platform, architecture and
      # @napi-rs/canvas version recorded in their manifest; on Linux they use the
      # tolerant comparison. The CLI encode tests skip when ffmpeg is not on PATH.
      - run: npm test

      # A golden mismatch writes the render and a diff image here.
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-diffs-node${{ matrix.node }}
          path: packages/waycine/node_modules/.tmp/golden/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      # Lists what npm would publish for both public packages.
      - run: npm pack --dry-run -w waycine -w waycine-cli

  e2e:
    name: e2e (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # CI makes playwright.config.ts start its own dev server and retry once;
      # WAYCINE_E2E_CHANNEL picks the installed Google Chrome (the default is Edge).
      CI: 'true'
      WAYCINE_E2E_CHANNEL: chrome
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The runner image ships Google Chrome, so no Playwright browser download.
      - name: Show the preinstalled Google Chrome
        run: google-chrome --version

      # No build step: the dev server serves the app and the engine from source, and
      # the specs resolve `waycine` to source through the web app's tsconfig paths.
      # `npm run e2e`, plus an HTML report to upload when something fails.
      - name: npm run e2e
        run: npm run e2e -w waycine-web -- --reporter=github,html

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
